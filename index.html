+S('Добро пожаловать','',`<div class="ltxt rv"><p>Школа — это территория, где можно получить качественное бесплатное образование под руководством компетентного педагогического состава в дружественной атмосфере. Перенять многолетний опыт педагогов, лучше ориентироваться в различных дисциплинах, проявить свои умения и таланты, стать частью большой семьи — это то, что представляет школьная жизнь. Здесь учатся коммуникабельности. Из школы выпускаются достойные граждане нашей страны, готовые вступить в диалог со взрослым миром.</p></div>`)
+S('Обращение директора','Экнодосьян Аршавир Алексанович, директор школы',`<div class="ltxt rv"><p>Уважаемые посетители! Рад приветствовать вас на сайте нашего муниципального бюджетного общеобразовательного учреждения средней общеобразовательной школы № 14.</p><p>Наша школа — дружная семья, где каждый заинтересован не только достичь успехов в учёбе, но и помочь другим, рядом находящимся, стать лучше и найти своё место в жизни.</p><p>Цель нашей школы — научить так, чтобы стремление достигать больших побед в различных сферах сопровождало наших выпускников на просторах жизни.</p><p>Наш педагогический состав ориентирован на мотивацию к получению новых знаний и навыков, чтобы обучающиеся были утверждены в том, что образование — это очень важно, а школа — временный путеводитель, приближающий к мечте.</p><p>Также для нас важно выпустить достойных граждан нашего государства. Перед нами каждый день стоит задача сохранить доброе влияние на наших ребят и даже воспитанников, так как без воспитания школа существовать не может. Мы акцентируем внимание на том, чтобы будущий гражданин, выпускник МБОУ СОШ № 14 им. С. С. Аракеляна мог засвидетельствовать образом своей жизни, мышления, что самое главное в человеке — человечность, на которой строится вся жизнь.</p><p>Наши педагоги поддерживают сотрудничество с родителями наших учеников, чтобы динамика успеваемости оставалась на высоком уровне.</p><p>Помимо образовательно-воспитательного контекста, школа реализует просветительские проекты и программы, проводит праздничные мероприятия и экскурсионные выезды.</p><p>На сайте вы сможете ознакомиться с основными данными о нашем учреждении, получить информацию о формах обучения и заочно познакомиться с педагогическим составом, а также найти программы, по которым реализуется образовательный процесс.</p><p>В нашем учреждении созданы условия для предоставления образовательных услуг людям с ограниченными возможностями здоровья.</p><p>За всей дополнительной информацией вы можете обратиться по указанным контактам либо посетить нас лично. Будем рады новому сотрудничеству в сфере образования!</p><p><b>С уважением, директор МБОУ СОШ № 14, Экнодосьян Аршавир Алексанович.</b></p></div>`,1)
+S('Имя школы и село','Школа носит имя Сурена Смбатовича Аракеляна и находится в Гай-Кодзоре',`<div class="g2"><div class="cd rv"><div class="n">01</div><h3>С. С. Аракелян</h3><p>Школа носит имя Сурена Смбатовича Аракеляна — так указано в её официальном названии.</p></div><div class="cd rv"><div class="n">02</div><h3>Гай-Кодзор</h3><p>Название села переводят как «армянское ущелье». Оно основано в начале XX века выходцами из Армении.</p></div></div>`)

+S('Правила приёма в школу','Закреплённая территория и адрес',`<div class="g2"><div class="cd rv"><div class="n">01</div><h3>Адрес школы</h3><p>Краснодарский край, Анапский район, с. Гай-Кодзор, ул. Дружбы, д. 50</p></div><div class="cd rv"><div class="n">02</div><h3>Как поступить</h3><p>Правила приёма, перевода и отчисления и электронная услуга записи ребёнка в школу размещены в разделе «Родителям и ученикам» официального сайта.</p><a class="cp" href="${O}roditelyam-i-uchenikam/poleznaya-informatsiya/pravila-priema-perevoda-otchisleniya/" target="_blank" rel="noopener">Открыть правила приёма ↗</a></div></div>`)
+S('Школьная столовая','Питание организовано в соответствии с требованиями СанПиН',`<div class="ltxt rv"><p>Организация горячего питания в школе — важное условие для поддержания здоровья обучающихся и их способности к эффективному обучению. Качественно отработанное меню, сбалансированное и полноценное питание способствует улучшению работоспособности, концентрации внимания и успеваемости. Здоровая пища — залог крепкого иммунитета.</p><p>Обучающиеся проводят в школе большую часть дня, поэтому питание организовано в соответствии со всеми требованиями СанПиН. Время, отведённое на принятие пищи, — от 10 до 20 минут. Площадь столовой позволяет принимать одновременно 4 класса. После каждой смены столовая проветривается перед приёмом следующих классов.</p><p>Правильное питание — основа здоровья человека. Неправильное питание и малоподвижный образ жизни — главные причины различных заболеваний. Пища должна быть рациональной, физиологически полноценной по количеству и качественному составу.</p></div>`,1)
+S('Диетическое питание','Алгоритм организации',`<div class="ltxt rv"><p>В соответствии с п. 8.2 СанПиН 2.3/2.4.3590-20 «Санитарно-эпидемиологические требования к организации общественного питания населения» в школе возможна организация питания по типовым специализированным меню для детей с непереносимостью коровьего молока, сахарным диабетом и заболеваниями желудочно-кишечного тракта. Детям, нуждающимся в лечебном питании, оно организуется по заключению участкового педиатра, представленному родителями (законными представителями).</p><div style="counter-reset:s"><div class="stp"><span>Родителю (законному представителю) рекомендуется обратиться к руководителю школы с заявлением о необходимости создать ребёнку специальные условия питания по состоянию здоровья, приложив рекомендации и заключение врача.</span></div><div class="stp"><span>На основании документов руководитель совместно с медицинским работником школы прорабатывает меню и режим питания. Для детей с сахарным диабетом — контроль уровня сахара в крови, введение инсулина, особенности питания и возможность использовать блюда и продукты, принесённые из дома.</span></div><div class="stp"><span>Руководитель информирует классного руководителя и работников столовой о наличии в классе детей с сахарным диабетом, целиакией, муковисцидозом, пищевой аллергией, об особенностях питания, мерах профилактики ухудшения здоровья и первой помощи.</span></div></div></div>`)
+S('Школьная библиотека','',`<div class="ltxt rv"><p>Библиотека оснащена необходимым материалом для предоставления образования по трём уровням: НОО (начальное общее), ООО (основное общее) и СОО (среднее общее образование). Реализуемая программа соответствует ФГОС. В НОО используется серия «Школа России», в ООО и СОО — различные УМК.</p></div><div class="g4" style="margin-top:20px">${['Читальный зал','Интерактивная доска','Компьютеры и интернет','МФУ'].map((x,i)=>`<div class="cd rv"><div class="n">0${i+1}</div><h3>${x}</h3></div>`).join('')}</div>`,1)

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$('#nv').innerHTML=R.map((r,i)=>`<a href="#/${r[0]}" style="transition-delay:${i*60}ms"><b>0${i+1}</b>${r[1]}</a>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');io.unobserve(e.target);const n=e.target.querySelector('[data-n]');if(n)cnt(n)}}),{threshold:.15});
function cnt(n){const to=+n.dataset.n,t0=performance.now();(function f(t){const p=Math.min((t-t0)/1400,1);n.textContent=Math.round(to*(1-Math.pow(1-p,3)))+n.dataset.s;if(p<1)requestAnimationFrame(f)})(t0)}
function go(){const k=(location.hash.replace('#/','')||'home');const key=P[k]?k:'home';$('#main').innerHTML=`<div class="pg on">${P[key]()}</div>`;document.title=R.find(r=>r[0]===key)[1]+' — МБОУ СОШ № 14';$$('#menu a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+key));document.body.classList.remove('open');$('#bg').setAttribute('aria-expanded','false');scrollTo(0,0);$$('.rv').forEach(e=>io.observe(e));
const fs=$('#fs');fs&&fs.addEventListener('input',()=>{const q=fs.value.toLowerCase();$$('#tg .tm').forEach(c=>c.style.display=c.dataset.t.includes(q)?'':'none')});
$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$$('.tp').forEach((p,i)=>p.classList.toggle('on',i==b.dataset.tab))});

$('#bg').onclick=()=>{const o=document.body.classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
document.body.addEventListener('click',e=>{if(document.body.classList.contains('open')&&e.target.closest('#menu a'))document.body.classList.remove('open')});
